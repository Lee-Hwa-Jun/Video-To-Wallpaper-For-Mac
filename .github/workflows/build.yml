name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"

      - name: Swift version
        run: swift --version

      - name: Build app bundle
        run: Scripts/build-app.sh release

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "Video Wallpaper.app" "Video-Wallpaper.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Wallpaper-macOS
          path: build/Video-Wallpaper.zip
          if-no-files-found: error
